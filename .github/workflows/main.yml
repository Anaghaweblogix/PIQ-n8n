name: Functional Summary

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  summarize:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Get commit information and diff
      - name: Prepare commit analysis
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $commit = "${{ github.sha }}"
          $parent = git rev-parse "${commit}^"

          Write-Host "Commit: $commit"
          Write-Host "Parent: $parent"

          $message = git log -1 --pretty=%B $commit
          $branch = "${{ github.ref_name }}"

          $diff = git diff --no-ext-diff --unified=80 $parent $commit

          $diff | Out-File `
            -FilePath "$env:GITHUB_WORKSPACE\commit_diff.txt" `
            -Encoding utf8

          @{
            commit = $commit
            parent = $parent
            branch = $branch
            message = $message
          } | ConvertTo-Json | Out-File `
            "$env:GITHUB_WORKSPACE\commit_info.json" `
            -Encoding utf8

          Write-Host "Commit message:"
          Write-Host $message

          Write-Host "Diff saved."

      # 3. Analyze with Anthropic API
      - name: Analyze commit with Claude
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |

          $commit = "${{ github.sha }}"
          $branch = "${{ github.ref_name }}"
          $parent = git rev-parse "${commit}^"

          $commitMessage = git log -1 --pretty=%B $commit

          $diff = Get-Content `
            "$env:GITHUB_WORKSPACE\commit_diff.txt" `
            -Raw

          $prompt = @"
          You are analyzing a software repository commit.

          Analyze ONLY the supplied commit information and git diff.
          Do not invent functionality that is not supported by the diff.

          COMMIT:
          $commit

          PARENT:
          $parent

          BRANCH:
          $branch

          COMMIT MESSAGE:
          $commitMessage

          ================================
          GIT DIFF
          ================================

          $diff

          ================================
          REQUIRED OUTPUT
          ================================

          Return ONLY valid JSON.

          Use exactly this structure:

          {
            "commit": "",
            "jira_keys": [],
            "audience_summary": "",
            "modules_touched": [],
            "files_added": [],
            "files_modified": [],
            "files_deleted": [],
            "functions_changed": [],
            "classes_changed": [],
            "imports_changed": [],
            "api_contract_changes": [],
            "db_migrations": [],
            "config_or_env_changes": [],
            "breaking_changes": [],
            "features_added": [],
            "behaviour_changes": [],
            "dependencies_affected": [],
            "tests_changed": [],
            "ewi_impact": "",
            "jira_work_evidence": []
          }

          RULES:

          1. jira_keys
             Extract Jira keys from the branch name and commit message.

          2. audience_summary
             Give 3-5 sentences explaining what changed in normal
             business language.

          3. modules_touched
             Identify logical modules/components affected.

          4. files_added
             List files newly added.

          5. files_modified
             List files modified.

          6. files_deleted
             List files deleted.

          7. functions_changed
             Identify functions added, removed or modified.

          8. classes_changed
             Identify classes added, removed or modified.

          9. imports_changed
             Identify important imports added or removed.

          10. api_contract_changes
              Identify API endpoints, parameters or request/response
              structures that changed.

          11. db_migrations
              Identify database schema or migration changes.

          12. config_or_env_changes
              Identify configuration and environment changes.

          13. breaking_changes
              Identify compatibility-breaking changes.

          14. features_added
              Describe actual features introduced.

          15. behaviour_changes
              Describe how application behaviour changed.

          16. dependencies_affected
              Explain how changed code affects other parts of the
              application.

          17. tests_changed
              Identify tests added, modified or removed.

          18. ewi_impact
              Explain whether this appears to affect an Electronic
              Work Instruction or related workflow.

              If there is no evidence, return:
              "No EWI impact identified."

          19. jira_work_evidence
              For each detected Jira key, explain what work in this
              commit provides evidence for that Jira ticket.

              Do not claim the entire Jira ticket is completed unless
              the diff provides evidence.

          If a category has no relevant changes, return [].

          RETURN ONLY JSON.
          "@

          # Build API request

          $body = @{
            model = "claude-sonnet-5"
            max_tokens = 12000
            messages = @(
              @{
                role = "user"
                content = $prompt
              }
            )
          } | ConvertTo-Json -Depth 10

          Write-Host "Sending commit to Anthropic..."

          $response = Invoke-RestMethod `
            -Uri "https://api.anthropic.com/v1/messages" `
            -Method Post `
            -Headers @{
              "x-api-key" = $env:ANTHROPIC_API_KEY
              "anthropic-version" = "2023-06-01"
              "content-type" = "application/json"
            } `
            -Body $body

          Write-Host "Claude response received."
          
          # Token usage
          $inputTokens = $response.usage.input_tokens
          $outputTokens = $response.usage.output_tokens
          $totalTokens = $inputTokens + $outputTokens
          
          Write-Host "================================"
          Write-Host "CLAUDE TOKEN USAGE"
          Write-Host "Input tokens : $inputTokens"
          Write-Host "Output tokens: $outputTokens"
          Write-Host "Total tokens : $totalTokens"
          Write-Host "================================"

          @{
            input_tokens = $inputTokens
            output_tokens = $outputTokens
            total_tokens = $totalTokens
          } | ConvertTo-Json | Out-File `
            "$env:GITHUB_WORKSPACE\token_usage.json" `
            -Encoding utf8
          
          Write-Host "Token usage saved."
          
          $text = ($response.content | Where-Object {
            $_.type -eq "text"
          }).text

          if (-not $text) {
            throw "Claude returned an empty response."
          }

          $text = $text.Trim()

          # Remove Markdown JSON fences if present
          $text = $text -replace '^```json\s*', ''
          $text = $text -replace '^```\s*', ''
          $text = $text -replace '\s*```$', ''

          $text | Out-File `
            -FilePath "$env:GITHUB_WORKSPACE\summary.json" `
            -Encoding utf8

          # Validate JSON
          Get-Content `
            "$env:GITHUB_WORKSPACE\summary.json" `
            -Raw | ConvertFrom-Json | Out-Null

          Write-Host "summary.json is valid JSON."

      # 4. Upload results
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: functional-summary-${{ github.sha }}
          path: |
            summary.json
            commit_diff.txt
            commit_info.json
          retention-days: 90
          
      # 5. Send analysis to n8n
      - name: Send analysis to n8n
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |

          Write-Host "===== STEP 1 ====="
          Write-Host "Starting n8n preparation..."

          # ----------------------------------------
          # Read files as JSON / text
          # ----------------------------------------

          Write-Host "Reading summary.json..."

          $summaryJson = Get-Content `
            "$env:GITHUB_WORKSPACE\summary.json" `
            -Raw

          Write-Host "summary.json loaded."

          Write-Host "Reading commit_info.json..."

          $commitInfoJson = Get-Content `
            "$env:GITHUB_WORKSPACE\commit_info.json" `
            -Raw

          Write-Host "commit_info.json loaded."

          Write-Host "Reading token_usage.json..."

          $tokenUsageJson = Get-Content `
            "$env:GITHUB_WORKSPACE\token_usage.json" `
            -Raw

          Write-Host "token_usage.json loaded."

          Write-Host "Reading commit_diff.txt..."

          $diff = Get-Content `
            "$env:GITHUB_WORKSPACE\commit_diff.txt" `
            -Raw

          Write-Host "commit_diff.txt loaded."
          Write-Host "Diff size: $($diff.Length) characters"

          # ----------------------------------------
          # Convert only the plain text values
          # ----------------------------------------

          Write-Host "Preparing Git diff JSON..."

          $diffJson = $diff | ConvertTo-Json -Compress

          Write-Host "Git diff JSON ready."

          # ----------------------------------------
          # Prepare basic GitHub information
          # ----------------------------------------

          $repositoryJson = "${{ github.repository }}" | ConvertTo-Json -Compress
          $workflowJson = "${{ github.workflow }}" | ConvertTo-Json -Compress
          $runIdJson = "${{ github.run_id }}" | ConvertTo-Json -Compress
          $runNumberJson = "${{ github.run_number }}" | ConvertTo-Json -Compress
          $commitJson = "${{ github.sha }}" | ConvertTo-Json -Compress
          $branchJson = "${{ github.ref_name }}" | ConvertTo-Json -Compress

          Write-Host "Basic information ready."

          # ----------------------------------------
          # Build final JSON manually
          # ----------------------------------------

          Write-Host "Building final JSON..."

          $json = @"
          {
            "repository": $repositoryJson,
            "workflow": $workflowJson,
            "run_id": $runIdJson,
            "run_number": $runNumberJson,
            "commit": $commitJson,
            "branch": $branchJson,
            "commit_info": $commitInfoJson,
            "analysis": $summaryJson,
            "git_diff": $diffJson,
            "token_usage": $tokenUsageJson
          }
          "@

          Write-Host "Final JSON created."
          Write-Host "Payload size: $($json.Length) characters"

          # ----------------------------------------
          # Validate JSON before sending
          # ----------------------------------------

          Write-Host "Validating JSON..."

          $json | ConvertFrom-Json | Out-Null

          Write-Host "JSON validation successful."

          # ----------------------------------------
          # Send to n8n
          # ----------------------------------------

          Write-Host "===== SENDING TO N8N ====="

          $result = Invoke-RestMethod `
            -Uri $env:N8N_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $json `
            -TimeoutSec 30

          Write-Host "================================"
          Write-Host "Successfully sent to n8n!"
          Write-Host "================================"
