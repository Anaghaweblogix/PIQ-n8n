name: Functional Summary
on:
  push:
    branches: [main]
jobs:
  summarize:
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read the diff for ${{ github.sha }} against its first parent.
            Write /tmp/summary.json with keys: commit, jira_keys (from branch or
            commit message), audience_summary (3-5 sentences, plain business
            language, what a user or auditor would notice), modules_touched,
            api_contract_changes, db_migrations, config_or_env_changes,
            breaking_changes, ewi_impact.
            Describe behaviour change, not file names. If nothing user-visible
            changed, say so plainly rather than padding.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,Write"
      - uses: actions/upload-artifact@v4
        with:
          name: functional-summary-${{ github.sha }}
          path: /tmp/summary.json
          retention-days: 90
