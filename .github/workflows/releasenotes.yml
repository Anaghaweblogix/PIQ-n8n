name: Generate Release Notes

on:
  workflow_dispatch:
    inputs:

      request_id:
        description: "Correlation ID supplied by n8n"
        required: true
        type: string

      range_type:
        description: "Select the Git change range"
        required: true
        type: choice
        options:
          - from_beginning
          - previous_release

      previous_release:
        description: "Previous release/tag (required for previous_release)"
        required: false
        type: string

      target_ref:
        description: "Target branch, tag, or commit"
        required: true
        default: "main"
        type: string

      release_name:
        description: "Release name/version"
        required: false
        type: string

      audience:
        description: "Who will read the release notes?"
        required: false
        type: choice
        default: customer
        options:
          - customer
          - product
          - internal
          - developer

      major_version:
        description: "Major version number"
        required: true
        type: string

      minor_version:
        description: "Minor version number"
        required: true
        type: string

      patch_version:
        description: "Patch version number"
        required: true
        type: string

      build_number:
        description: "Build number"
        required: true
        type: string

      audience_tags_json:
        description: "JSON array of Release Notes UI audience tags"
        required: false
        default: "[]"
        type: string

      images_json:
        description: "JSON array of pre-uploaded image metadata"
        required: false
        default: "[]"
        type: string

      requested_by:
        description: "User/service that requested generation"
        required: true
        type: string


permissions:
  contents: read
  pull-requests: read


jobs:

  generate-release-notes:

    runs-on: self-hosted

    timeout-minutes: 30

    steps:

      # ============================================================
      # 0. TRUST THE RUNNER WORKSPACE
      #
      # The self-hosted runner checks out as one account and runs
      # steps as another, so git refuses to read the repository
      # until the workspace is marked safe.
      # ============================================================

      - name: Trust runner workspace
        shell: powershell
        run: |

          $workspace = "$env:GITHUB_WORKSPACE" -replace '\\', '/'

          Write-Host "Marking workspace as safe: $workspace"


          $existing = @(git config --global --get-all safe.directory 2>$null)


          if ($existing -notcontains $workspace) {

              git config --global --add safe.directory "$workspace"
          }


          git config --global --get-all safe.directory

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}


      # ============================================================
      # 2. DISPLAY REQUEST
      # ============================================================

      - name: Display release request
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "       RELEASE NOTES GENERATION"
          Write-Host "=============================================="

          Write-Host "Repository       : $env:GITHUB_REPOSITORY"
          Write-Host "Range Type       : ${{ inputs.range_type }}"
          Write-Host "Previous Release : ${{ inputs.previous_release }}"
          Write-Host "Target Ref       : ${{ inputs.target_ref }}"
          Write-Host "Release Name     : ${{ inputs.release_name }}"
          Write-Host "Audience         : ${{ inputs.audience }}"

          Write-Host "=============================================="


      # ============================================================
      # 3. DETERMINE GIT RANGE
      # ============================================================

      - name: Determine Git range
        id: git_range
        shell: powershell
        run: |

          $rangeType = "${{ inputs.range_type }}"
          $targetRef = "${{ inputs.target_ref }}"
          $previousRelease = "${{ inputs.previous_release }}"

          Write-Host "Determining Git range..."


          # --------------------------------------------------------
          # PREVIOUS RELEASE
          # --------------------------------------------------------

          if ($rangeType -eq "previous_release") {

              if ([string]::IsNullOrWhiteSpace($previousRelease)) {

                  throw "previous_release is required when range_type is previous_release."
              }


              Write-Host "Previous release: $previousRelease"


              git rev-parse "$previousRelease" | Out-Null


              if ($LASTEXITCODE -ne 0) {

                  throw "Previous release/tag '$previousRelease' could not be found."
              }


              $from = git rev-parse "$previousRelease"

              $to = git rev-parse "$targetRef"
          }


          # --------------------------------------------------------
          # FROM BEGINNING
          # --------------------------------------------------------

          elseif ($rangeType -eq "from_beginning") {

              Write-Host "Starting from first repository commit."


              $from = git rev-list `
                --max-parents=0 `
                "$targetRef" |
                Select-Object -Last 1


              $to = git rev-parse "$targetRef"
          }


          else {

              throw "Unknown range_type: $rangeType"
          }


          # --------------------------------------------------------
          # VALIDATE
          # --------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($from)) {

              throw "Unable to determine starting commit."
          }


          if ([string]::IsNullOrWhiteSpace($to)) {

              throw "Unable to determine target commit."
          }


          Write-Host "FROM: $from"

          Write-Host "TO  : $to"


          # --------------------------------------------------------
          # OUTPUT
          # --------------------------------------------------------

          "from=$from" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append


          "to=$to" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append


      # ============================================================
      # 4. COLLECT COMMITS
      # ============================================================

      - name: Collect commits
        shell: powershell
        run: |

          $from = "${{ steps.git_range.outputs.from }}"

          $to = "${{ steps.git_range.outputs.to }}"

          $rangeType = "${{ inputs.range_type }}"


          Write-Host "Collecting commits..."


          # --------------------------------------------------------
          # FROM BEGINNING
          # --------------------------------------------------------

          if ($rangeType -eq "from_beginning") {

              git log "$to" `
                --pretty=format:'%H|%an|%ae|%ad|%s' `
                --date=iso |
                Out-File `
                  "$env:GITHUB_WORKSPACE\commits.txt" `
                  -Encoding utf8


              $commitCount = git rev-list --count "$to"
          }


          # --------------------------------------------------------
          # PREVIOUS RELEASE
          # --------------------------------------------------------

          else {

              git log "$from..$to" `
                --pretty=format:'%H|%an|%ae|%ad|%s' `
                --date=iso |
                Out-File `
                  "$env:GITHUB_WORKSPACE\commits.txt" `
                  -Encoding utf8


              $commitCount = git rev-list --count "$from..$to"
          }


          Write-Host "Commit count: $commitCount"


          @{
              count = [int]$commitCount
          } |
          ConvertTo-Json |
          Out-File `
            "$env:GITHUB_WORKSPACE\commit_stats.json" `
            -Encoding utf8


      # ============================================================
      # 5. COLLECT CHANGED FILES
      # ============================================================

      - name: Collect changed files
        shell: powershell
        run: |

          $from = "${{ steps.git_range.outputs.from }}"

          $to = "${{ steps.git_range.outputs.to }}"


          Write-Host "Collecting changed files..."


          git diff `
            --name-status `
            "$from" `
            "$to" |
            Out-File `
              "$env:GITHUB_WORKSPACE\changed_files.txt" `
              -Encoding utf8


          Write-Host "Changed files collected."


      # ============================================================
      # 6. COLLECT FILE STATISTICS
      # ============================================================

      - name: Collect file statistics
        shell: powershell
        run: |

          $from = "${{ steps.git_range.outputs.from }}"

          $to = "${{ steps.git_range.outputs.to }}"


          Write-Host "Collecting file statistics..."


          git diff `
            --stat `
            "$from" `
            "$to" |
            Out-File `
              "$env:GITHUB_WORKSPACE\file_statistics.txt" `
              -Encoding utf8


          Write-Host "File statistics collected."


      # ============================================================
      # 7. EXTRACT WORK ITEM REFERENCES
      # ============================================================

      - name: Extract work item references
        shell: powershell
        run: |

          $from = "${{ steps.git_range.outputs.from }}"

          $to = "${{ steps.git_range.outputs.to }}"

          $rangeType = "${{ inputs.range_type }}"


          Write-Host "Extracting work-item references..."


          # --------------------------------------------------------
          # GET COMMIT MESSAGES
          # --------------------------------------------------------

          if ($rangeType -eq "from_beginning") {

              $commitMessages = git log `
                "$to" `
                --pretty=format:'%s%n%b'
          }

          else {

              $commitMessages = git log `
                "$from..$to" `
                --pretty=format:'%s%n%b'
          }


          # --------------------------------------------------------
          # EXTRACT WORK ITEMS
          #
          # Examples:
          #
          # PROJ-123
          # PIQ-456
          # DEV-789
          # --------------------------------------------------------

          $matches = [regex]::Matches(
              ($commitMessages -join "`n"),
              '\b[A-Z][A-Z0-9]+-\d+\b'
          )


          $workItems = $matches |
            ForEach-Object {
                $_.Value
            } |
            Sort-Object -Unique


          # --------------------------------------------------------
          # SAVE
          # --------------------------------------------------------

          $workItems |
            ConvertTo-Json |
            Out-File `
              "$env:GITHUB_WORKSPACE\work_items.json" `
              -Encoding utf8


          Write-Host "Detected work items:"


          if ($workItems.Count -eq 0) {

              Write-Host "None"
          }

          else {

              $workItems |
                ForEach-Object {
                    Write-Host " - $_"
                }
          }


      # ============================================================
      # 8. COLLECT RELEASE PULL REQUESTS
      #
      # Optimized:
      # Get merged PRs once instead of querying every commit.
      # ============================================================

      - name: Collect release pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |

          Write-Host "=============================================="

          Write-Host "Collecting release pull requests..."

          Write-Host "=============================================="


          $from = "${{ steps.git_range.outputs.from }}"

          $to = "${{ steps.git_range.outputs.to }}"

          $repo = "${{ github.repository }}"

          $targetRef = "${{ inputs.target_ref }}"


          Write-Host "Repository : $repo"

          Write-Host "FROM       : $from"

          Write-Host "TO         : $to"

          Write-Host "Target ref : $targetRef"


          # --------------------------------------------------------
          # DETERMINE BASE BRANCH
          # --------------------------------------------------------

          $baseBranch = $targetRef


          git show-ref `
            --verify `
            --quiet `
            "refs/remotes/origin/$targetRef"


          if ($LASTEXITCODE -ne 0) {

              Write-Host "Target ref is not a branch."


              $baseBranch = gh repo view "$repo" `
                --json defaultBranchRef `
                --jq ".defaultBranchRef.name"


              Write-Host "Using default branch: $baseBranch"
          }


          # --------------------------------------------------------
          # GET MERGED PRs
          # --------------------------------------------------------

          Write-Host "Getting merged PRs..."


          $prJson = gh pr list `
            --repo "$repo" `
            --state merged `
            --base "$baseBranch" `
            --limit 1000 `
            --json number,title,body,author,mergedAt,baseRefName,headRefName,labels,url,mergeCommit


          if (-not $prJson) {

              Write-Host "No merged PRs found."


              "[]" |
                Out-File `
                  "$env:GITHUB_WORKSPACE\pull_requests.json" `
                  -Encoding utf8


              exit 0
          }


          $allPRs = $prJson | ConvertFrom-Json


          Write-Host "Merged PRs retrieved: $($allPRs.Count)"


          # --------------------------------------------------------
          # FILTER PRs BY RANGE
          # --------------------------------------------------------

          $releasePRs = @()


          foreach ($pr in $allPRs) {

              if ($null -eq $pr.mergeCommit) {

                  continue
              }


              $mergeSha = $pr.mergeCommit.oid


              if ([string]::IsNullOrWhiteSpace($mergeSha)) {

                  continue
              }


              # ----------------------------------------------------
              # FROM must be ancestor of merge commit
              # ----------------------------------------------------

              git merge-base `
                --is-ancestor `
                "$from" `
                "$mergeSha"


              $fromIsAncestor = ($LASTEXITCODE -eq 0)


              # ----------------------------------------------------
              # Merge commit must be ancestor of target
              # ----------------------------------------------------

              git merge-base `
                --is-ancestor `
                "$mergeSha" `
                "$to"


              $mergeIsBeforeTarget = ($LASTEXITCODE -eq 0)


              if ($fromIsAncestor -and $mergeIsBeforeTarget) {

                  Write-Host "Including PR #$($pr.number): $($pr.title)"

                  $releasePRs += $pr
              }
          }


          # --------------------------------------------------------
          # SORT
          # --------------------------------------------------------

          $releasePRs = @(
              $releasePRs |
              Sort-Object mergedAt
          )


          Write-Host "=============================================="

          Write-Host "Release PR count: $($releasePRs.Count)"

          Write-Host "=============================================="


          # --------------------------------------------------------
          # SAVE
          # --------------------------------------------------------

          $releasePRs |
            ConvertTo-Json -Depth 20 |
            Out-File `
              "$env:GITHUB_WORKSPACE\pull_requests.json" `
              -Encoding utf8


          Write-Host "Pull request data saved."


      # ============================================================
      # 9. BUILD RELEASE CONTEXT
      #
      # IMPORTANT:
      # Plain text is used here.
      # No large ConvertTo-Json operation.
      # ============================================================

      - name: Build release context
        shell: powershell
        run: |

          Write-Host "=============================================="

          Write-Host "Building release context..."

          Write-Host "=============================================="


          $from = "${{ steps.git_range.outputs.from }}"

          $to = "${{ steps.git_range.outputs.to }}"


          # --------------------------------------------------------
          # COMMITS
          # --------------------------------------------------------

          Write-Host "Loading commits..."


          $commits = Get-Content `
            "$env:GITHUB_WORKSPACE\commits.txt" `
            -Raw


          Write-Host "Commits loaded: $($commits.Length) characters"


          # --------------------------------------------------------
          # CHANGED FILES
          # --------------------------------------------------------

          Write-Host "Loading changed files..."


          $changedFiles = Get-Content `
            "$env:GITHUB_WORKSPACE\changed_files.txt" `
            -Raw


          Write-Host "Changed files loaded: $($changedFiles.Length) characters"


          # --------------------------------------------------------
          # FILE STATISTICS
          # --------------------------------------------------------

          Write-Host "Loading file statistics..."


          $fileStatistics = Get-Content `
            "$env:GITHUB_WORKSPACE\file_statistics.txt" `
            -Raw


          Write-Host "File statistics loaded: $($fileStatistics.Length) characters"


          # --------------------------------------------------------
          # PULL REQUESTS
          # --------------------------------------------------------

          Write-Host "Loading pull requests..."


          $pullRequests = Get-Content `
            "$env:GITHUB_WORKSPACE\pull_requests.json" `
            -Raw


          Write-Host "Pull requests loaded: $($pullRequests.Length) characters"


          # --------------------------------------------------------
          # WORK ITEMS
          # --------------------------------------------------------

          Write-Host "Loading work items..."


          $workItems = Get-Content `
            "$env:GITHUB_WORKSPACE\work_items.json" `
            -Raw


          Write-Host "Work items loaded: $($workItems.Length) characters"


          # --------------------------------------------------------
          # BUILD CONTEXT
          # --------------------------------------------------------

          Write-Host "Creating plain-text release context..."


          $contextParts = @()


          $contextParts += "============================================================"

          $contextParts += "RELEASE INFORMATION"

          $contextParts += "============================================================"

          $contextParts += ""

          $contextParts += "Repository: ${{ github.repository }}"

          $contextParts += "Branch: ${{ github.ref_name }}"

          $contextParts += "Release: ${{ inputs.release_name }}"

          $contextParts += "Range Type: ${{ inputs.range_type }}"

          $contextParts += "Previous Release: ${{ inputs.previous_release }}"

          $contextParts += "Target Ref: ${{ inputs.target_ref }}"

          $contextParts += "Audience: ${{ inputs.audience }}"

          $contextParts += ""

          $contextParts += "FROM COMMIT:"

          $contextParts += $from

          $contextParts += ""

          $contextParts += "TO COMMIT:"

          $contextParts += $to

          $contextParts += ""


          $contextParts += "============================================================"

          $contextParts += "COMMITS"

          $contextParts += "============================================================"

          $contextParts += $commits

          $contextParts += ""


          $contextParts += "============================================================"

          $contextParts += "PULL REQUESTS"

          $contextParts += "============================================================"

          $contextParts += $pullRequests

          $contextParts += ""


          $contextParts += "============================================================"

          $contextParts += "CHANGED FILES"

          $contextParts += "============================================================"

          $contextParts += $changedFiles

          $contextParts += ""


          $contextParts += "============================================================"

          $contextParts += "FILE STATISTICS"

          $contextParts += "============================================================"

          $contextParts += $fileStatistics

          $contextParts += ""


          $contextParts += "============================================================"

          $contextParts += "WORK ITEMS"

          $contextParts += "============================================================"

          $contextParts += $workItems

          $contextParts += ""


          $contextParts += "============================================================"

          $contextParts += "END RELEASE CONTEXT"

          $contextParts += "============================================================"


          $context = $contextParts -join "`r`n"


          # --------------------------------------------------------
          # SAVE
          # --------------------------------------------------------

          $context |
            Out-File `
              "$env:GITHUB_WORKSPACE\release_context.txt" `
              -Encoding utf8


          Write-Host "=============================================="

          Write-Host "Release context created."

          Write-Host "Context size: $($context.Length) characters"

          Write-Host "=============================================="


      # ============================================================
      # 10. GENERATE CUSTOMER-FOCUSED RELEASE NOTES WITH CLAUDE
      # ============================================================

      - name: Generate release notes with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: powershell
        run: |

          Write-Host "=============================================="

          Write-Host "       CLAUDE RELEASE ANALYSIS"

          Write-Host "=============================================="


          # --------------------------------------------------------
          # LOAD CONTEXT
          # --------------------------------------------------------

          $context = Get-Content `
            "$env:GITHUB_WORKSPACE\release_context.txt" `
            -Raw


          Write-Host "Claude context size: $($context.Length) characters"


          # --------------------------------------------------------
          # CUSTOMER / AUDIENCE FOCUS
          # --------------------------------------------------------

          $audience = "${{ inputs.audience }}"


          # --------------------------------------------------------
          # BUILD PROMPT
          # --------------------------------------------------------

          $promptParts = @()


          $promptParts += "You are an expert product release analyst."

          $promptParts += ""

          $promptParts += "Your job is to analyze Git repository changes and transform them into meaningful release notes for the selected audience."

          $promptParts += ""

          $promptParts += "SELECTED AUDIENCE: $audience"

          $promptParts += ""


          # ========================================================
          # CORE ANALYSIS INSTRUCTIONS
          # ========================================================

          $promptParts += "============================================================"

          $promptParts += "CORE ANALYSIS INSTRUCTIONS"

          $promptParts += "============================================================"

          $promptParts += ""


          $promptParts += "Do NOT simply summarize commit messages."

          $promptParts += ""

          $promptParts += "Determine what the changes mean from the perspective of the selected audience."

          $promptParts += ""

          $promptParts += "For every meaningful change, determine:"

          $promptParts += "1. What changed?"

          $promptParts += "2. What can the user or customer do now?"

          $promptParts += "3. What became easier, faster, clearer, safer, or more reliable?"

          $promptParts += "4. Who is affected?"

          $promptParts += "5. Why does the change matter?"

          $promptParts += "6. Is the change actually visible or relevant to the user?"

          $promptParts += ""


          $promptParts += "Technical implementation details are evidence."

          $promptParts += "They are NOT automatically customer-facing release notes."

          $promptParts += ""


          $promptParts += "For example:"

          $promptParts += ""

          $promptParts += "BAD CUSTOMER DESCRIPTION:"

          $promptParts += "Added RetryService to DocumentProcessor."

          $promptParts += ""

          $promptParts += "BETTER CUSTOMER DESCRIPTION:"

          $promptParts += "Document processing is now more resilient to temporary failures, reducing the need for users to restart processing."

          $promptParts += ""


          # ========================================================
          # AUDIENCE-SPECIFIC RULES
          # ========================================================

          $promptParts += "============================================================"

          $promptParts += "AUDIENCE RULES"

          $promptParts += "============================================================"

          $promptParts += ""


          $promptParts += "CUSTOMER:"

          $promptParts += "- Focus on user-visible capabilities and benefits."

          $promptParts += "- Explain changes in simple business language."

          $promptParts += "- Explain why the change matters to the customer."

          $promptParts += "- Mention affected user groups when evidence supports it."

          $promptParts += "- Do not expose internal implementation details unless they directly affect the customer."

          $promptParts += "- Do not lead with file names, class names, services, libraries, commits, or internal architecture."

          $promptParts += ""


          $promptParts += "PRODUCT:"

          $promptParts += "- Focus on capabilities, workflows, product behaviour, outcomes, and business/user impact."

          $promptParts += "- Technical information should only be included when relevant to product behaviour."

          $promptParts += ""


          $promptParts += "INTERNAL:"

          $promptParts += "- Include user impact plus important operational and implementation implications."

          $promptParts += ""


          $promptParts += "DEVELOPER:"

          $promptParts += "- Include APIs, technical changes, implementation details, dependencies, configuration, and architecture where supported."

          $promptParts += ""


          # ========================================================
          # EVIDENCE RULES
          # ========================================================

          $promptParts += "============================================================"

          $promptParts += "EVIDENCE RULES"

          $promptParts += "============================================================"

          $promptParts += ""


          $promptParts += "Use only the supplied repository evidence."

          $promptParts += ""

          $promptParts += "The evidence includes commits, pull requests, changed files, file statistics, and work-item references."

          $promptParts += ""

          $promptParts += "Do not invent functionality."

          $promptParts += "Do not assume a feature exists simply because a file or class has a related name."

          $promptParts += "Do not assume a work item was completed simply because its ID appears in a commit."

          $promptParts += "Do not invent customer benefits that cannot reasonably be supported by the changes."

          $promptParts += "Do not claim a performance improvement unless the evidence supports it."

          $promptParts += "Do not claim a security improvement unless the evidence supports it."

          $promptParts += "Do not claim a breaking change unless there is evidence."

          $promptParts += ""


          $promptParts += "When the evidence is insufficient to determine a customer benefit, describe the change conservatively."

          $promptParts += ""


          # ========================================================
          # RELEASE INFORMATION
          # ========================================================

          $promptParts += "============================================================"

          $promptParts += "RELEASE INFORMATION"

          $promptParts += "============================================================"

          $promptParts += ""

          $promptParts += "Repository: ${{ github.repository }}"

          $promptParts += "Release: ${{ inputs.release_name }}"

          $promptParts += "Range Type: ${{ inputs.range_type }}"

          $promptParts += "Previous Release: ${{ inputs.previous_release }}"

          $promptParts += "Target: ${{ inputs.target_ref }}"

          $promptParts += "Audience: $audience"

          $promptParts += ""


          # ========================================================
          # REPOSITORY CONTEXT
          # ========================================================

          $promptParts += "============================================================"

          $promptParts += "REPOSITORY CHANGE CONTEXT"

          $promptParts += "============================================================"

          $promptParts += ""

          $promptParts += $context

          $promptParts += ""


          # ========================================================
          # REQUIRED OUTPUT
          # ========================================================

          $promptParts += "============================================================"

          $promptParts += "REQUIRED OUTPUT"

          $promptParts += "============================================================"

          $promptParts += ""


          $promptParts += "Return ONLY valid JSON."

          $promptParts += ""


          $promptParts += "Use exactly this structure:"

          $promptParts += ""


          $promptParts += '{'

          $promptParts += '  "release": {'

          $promptParts += '    "name": "",'

          $promptParts += '    "from": "",'

          $promptParts += '    "to": ""'

          $promptParts += '  },'


          $promptParts += '  "executive_summary": "",'


          $promptParts += '  "customer_summary": "",'


          $promptParts += '  "highlights": ['

          $promptParts += '    {'

          $promptParts += '      "title": "",'

          $promptParts += '      "description": "",'

          $promptParts += '      "user_benefit": "",'

          $promptParts += '      "affected_users": "",'

          $promptParts += '      "source": {'

          $promptParts += '        "pull_requests": [],'

          $promptParts += '        "commits": [],'

          $promptParts += '        "work_items": []'

          $promptParts += '      }'

          $promptParts += '    }'

          $promptParts += '  ],'


          $promptParts += '  "new_capabilities": ['

          $promptParts += '    {'

          $promptParts += '      "title": "",'

          $promptParts += '      "description": "",'

          $promptParts += '      "user_benefit": "",'

          $promptParts += '      "affected_users": "",'

          $promptParts += '      "source": {'

          $promptParts += '        "pull_requests": [],'

          $promptParts += '        "commits": [],'

          $promptParts += '        "work_items": []'

          $promptParts += '      }'

          $promptParts += '    }'

          $promptParts += '  ],'


          $promptParts += '  "improvements": ['

          $promptParts += '    {'

          $promptParts += '      "title": "",'

          $promptParts += '      "description": "",'

          $promptParts += '      "user_benefit": "",'

          $promptParts += '      "affected_users": "",'

          $promptParts += '      "source": {'

          $promptParts += '        "pull_requests": [],'

          $promptParts += '        "commits": [],'

          $promptParts += '        "work_items": []'

          $promptParts += '      }'

          $promptParts += '    }'

          $promptParts += '  ],'


          $promptParts += '  "bug_fixes": ['

          $promptParts += '    {'

          $promptParts += '      "title": "",'

          $promptParts += '      "description": "",'

          $promptParts += '      "user_benefit": "",'

          $promptParts += '      "affected_users": "",'

          $promptParts += '      "source": {'

          $promptParts += '        "pull_requests": [],'

          $promptParts += '        "commits": [],'

          $promptParts += '        "work_items": []'

          $promptParts += '      }'

          $promptParts += '    }'

          $promptParts += '  ],'


          $promptParts += '  "user_experience_changes": ['

          $promptParts += '    {'

          $promptParts += '      "title": "",'

          $promptParts += '      "description": "",'

          $promptParts += '      "user_benefit": "",'

          $promptParts += '      "affected_users": "",'

          $promptParts += '      "source": {'

          $promptParts += '        "pull_requests": [],'

          $promptParts += '        "commits": [],'

          $promptParts += '        "work_items": []'

          $promptParts += '      }'

          $promptParts += '    }'

          $promptParts += '  ],'


          $promptParts += '  "important_changes": ['

          $promptParts += '    {'

          $promptParts += '      "title": "",'

          $promptParts += '      "description": "",'

          $promptParts += '      "customer_impact": "",'

          $promptParts += '      "source": {'

          $promptParts += '        "pull_requests": [],'

          $promptParts += '        "commits": [],'

          $promptParts += '        "work_items": []'

          $promptParts += '      }'

          $promptParts += '    }'

          $promptParts += '  ],'


          $promptParts += '  "localized_content": {'

          $promptParts += '    "en-GB": { "summary": "", "note": "" },'

          $promptParts += '    "en-US": { "summary": "", "note": "" },'

          $promptParts += '    "de-DE": { "summary": "", "note": "" },'

          $promptParts += '    "es-ES": { "summary": "", "note": "" },'

          $promptParts += '    "fr-FR": { "summary": "", "note": "" }'

          $promptParts += '  },'


          $promptParts += '  "technical_notes": [],'


          $promptParts += '  "work_items": [],'


          $promptParts += '  "statistics": {'

          $promptParts += '    "commits": 0,'

          $promptParts += '    "pull_requests": 0,'

          $promptParts += '    "files_changed": 0'

          $promptParts += '  }'


          $promptParts += '}'


          $promptParts += ""


          # ========================================================
          # FINAL CUSTOMER-FOCUS RULES
          # ========================================================

          $promptParts += "============================================================"

          $promptParts += "FINAL CUSTOMER-FOCUS RULES"

          $promptParts += "============================================================"

          $promptParts += ""


          $promptParts += "1. Prioritize what changed for users over how it was implemented."

          $promptParts += "2. Translate technical changes into user outcomes when the evidence supports that translation."

          $promptParts += "3. Combine multiple commits that represent the same user-facing change."

          $promptParts += "4. Avoid repeating the same change across multiple categories."

          $promptParts += "5. Do not turn every commit into a release-note item."

          $promptParts += "6. Internal refactoring should not appear as a customer feature."

          $promptParts += "7. Dependency updates should not appear as customer improvements unless they have a demonstrated user impact."

          $promptParts += "8. Test changes should normally not appear in customer release notes."

          $promptParts += "9. CI/CD changes should normally not appear in customer release notes."

          $promptParts += "10. File names and class names should normally be omitted from customer-facing descriptions."

          $promptParts += "11. Explain the practical outcome instead of the implementation."

          $promptParts += "12. Use clear language that a non-technical customer can understand."

          $promptParts += "13. Do not exaggerate the importance of a change."

          $promptParts += "14. Do not claim that a change improves something unless the repository evidence supports it."

          $promptParts += "15. If there are no meaningful customer-facing changes in a category, return an empty array."

          $promptParts += "16. Populate localized_content in all five locales. Summary must be concise plain text. Note must be complete Markdown suitable for the release-note editor."

          $promptParts += "17. en-GB is the source wording. en-US must use US spelling. German, Spanish, and French must be accurate translations with no invented details."

          $promptParts += "18. Return ONLY valid JSON."


          $prompt = $promptParts -join "`r`n"


          # ========================================================
          # BUILD CLAUDE REQUEST
          # ========================================================

          $body = @{
              model = "claude-sonnet-5"

              max_tokens = 16000

              messages = @(
                  @{
                      role = "user"

                      content = $prompt
                  }
              )
          } |
          ConvertTo-Json -Depth 30


          Write-Host "Sending request to Claude..."


          # ========================================================
          # CALL CLAUDE
          # ========================================================

          $response = Invoke-RestMethod `
            -Uri "https://api.anthropic.com/v1/messages" `
            -Method Post `
            -Headers @{
                "x-api-key" = $env:ANTHROPIC_API_KEY
                "anthropic-version" = "2023-06-01"
                "content-type" = "application/json"
            } `
            -Body $body


          Write-Host "Claude response received."


          # ========================================================
          # TOKEN USAGE
          # ========================================================

          $inputTokens = $response.usage.input_tokens

          $outputTokens = $response.usage.output_tokens

          $totalTokens = $inputTokens + $outputTokens


          Write-Host "=============================================="

          Write-Host "CLAUDE TOKEN USAGE"

          Write-Host "Input tokens : $inputTokens"

          Write-Host "Output tokens: $outputTokens"

          Write-Host "Total tokens : $totalTokens"

          Write-Host "=============================================="


          @{
              input_tokens = $inputTokens
              output_tokens = $outputTokens
              total_tokens = $totalTokens
          } |
          ConvertTo-Json |
          Out-File `
            "$env:GITHUB_WORKSPACE\token_usage.json" `
            -Encoding utf8


          # ========================================================
          # EXTRACT CLAUDE RESPONSE
          # ========================================================

          $text = (
              $response.content |
              Where-Object {
                  $_.type -eq "text"
              }
          ).text


          if (-not $text) {

              throw "Claude returned an empty response."
          }


          $text = $text.Trim()


          # --------------------------------------------------------
          # REMOVE MARKDOWN JSON FENCES
          # --------------------------------------------------------

          $text = $text -replace '^```json\s*', ''

          $text = $text -replace '^```\s*', ''

          $text = $text -replace '\s*```$', ''

          $text = $text.Trim()


          # ========================================================
          # VALIDATE JSON
          # ========================================================

          try {

              $releaseNotesObject = $text |
                ConvertFrom-Json
          }

          catch {

              Write-Host "=============================================="

              Write-Host "CLAUDE RETURNED INVALID JSON"

              Write-Host "=============================================="

              Write-Host $text

              throw "Claude response is not valid JSON."
          }


          # ========================================================
          # SAVE RELEASE NOTES
          # ========================================================

          $releaseNotesObject |
            ConvertTo-Json -Depth 30 |
            Out-File `
              "$env:GITHUB_WORKSPACE\release_notes.json" `
              -Encoding utf8


          Write-Host "Release notes JSON validated successfully."


      # ============================================================
      # 11. BUILD FINAL N8N PAYLOAD
      #
      # IMPORTANT:
      # Do NOT send the complete Git context to n8n.
      # Only send the generated release analysis.
      # ============================================================

      - name: Build n8n payload
        env:
          AUDIENCE_TAGS_JSON: ${{ inputs.audience_tags_json }}
          IMAGES_JSON: ${{ inputs.images_json }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        shell: powershell
        run: |

          Write-Host "=============================================="

          Write-Host "Building final n8n payload..."

          Write-Host "=============================================="


          # --------------------------------------------------------
          # LOAD RELEASE NOTES
          # --------------------------------------------------------

          Write-Host "Loading release notes..."


          $releaseNotes = Get-Content `
            "$env:GITHUB_WORKSPACE\release_notes.json" `
            -Raw |
            ConvertFrom-Json


          # --------------------------------------------------------
          # LOAD TOKEN USAGE
          # --------------------------------------------------------

          Write-Host "Loading token usage..."


          $tokenUsage = Get-Content `
            "$env:GITHUB_WORKSPACE\token_usage.json" `
            -Raw |
            ConvertFrom-Json


          # --------------------------------------------------------
          # COUNT COMMITS
          # --------------------------------------------------------

          $commitCount = 0

          $commitShas = @()

          if (Test-Path "$env:GITHUB_WORKSPACE\commits.txt") {

              $commitLines = @(
                Get-Content "$env:GITHUB_WORKSPACE\commits.txt"
              )

              $commitCount = $commitLines.Count

              $commitShas = @(
                $commitLines |
                  ForEach-Object {
                    if ($_ -match '^([^|]+)\|') {
                      $Matches[1]
                    }
                  } |
                  Sort-Object -Unique
              )
          }


          # --------------------------------------------------------
          # COUNT CHANGED FILES
          # --------------------------------------------------------

          $changedFileCount = 0


          if (Test-Path "$env:GITHUB_WORKSPACE\changed_files.txt") {

              $changedFileCount = @(
                  Get-Content `
                    "$env:GITHUB_WORKSPACE\changed_files.txt"
              ).Count
          }


          # --------------------------------------------------------
          # COUNT PULL REQUESTS
          # --------------------------------------------------------

          $pullRequestCount = 0

          $pullRequestNumbers = @()

          if (Test-Path "$env:GITHUB_WORKSPACE\pull_requests.json") {

              $prs = Get-Content `
                "$env:GITHUB_WORKSPACE\pull_requests.json" `
                -Raw |
                ConvertFrom-Json


              $pullRequestCount = @($prs).Count

              $pullRequestNumbers = @(
                $prs |
                  ForEach-Object { [int]$_.number } |
                  Sort-Object -Unique
              )
          }


          # --------------------------------------------------------
          # VALIDATE REQUEST METADATA
          # --------------------------------------------------------

          try {
              $audienceTags = @($env:AUDIENCE_TAGS_JSON | ConvertFrom-Json)
              $images = @($env:IMAGES_JSON | ConvertFrom-Json)
          }
          catch {
              throw "Request audience/image metadata is not valid JSON."
          }


          # ========================================================
          # SMALL N8N PAYLOAD
          # ========================================================

          $payload = @{

              status = "completed"

              request_id = "${{ inputs.request_id }}"

              repository = "${{ github.repository }}"


              workflow = "${{ github.workflow }}"


              run_id = "${{ github.run_id }}"


              run_number = "${{ github.run_number }}"

              run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

              generated_at = (Get-Date).ToUniversalTime().ToString("o")

              requested_by = $env:REQUESTED_BY

              audience = "${{ inputs.audience }}"

              audience_tags = $audienceTags

              images = $images

              version = @{
                  major = [int]"${{ inputs.major_version }}"
                  minor = [int]"${{ inputs.minor_version }}"
                  patch = [int]"${{ inputs.patch_version }}"
                  build = [int]"${{ inputs.build_number }}"
              }

              release = @{

                  name = "${{ inputs.release_name }}"

                  range_type = "${{ inputs.range_type }}"

                  previous_release = "${{ inputs.previous_release }}"

                  target_ref = "${{ inputs.target_ref }}"

                  from = "${{ steps.git_range.outputs.from }}"

                  to = "${{ steps.git_range.outputs.to }}"
              }


              release_notes = $releaseNotes

              source_analysis = @{
                  commit_shas = $commitShas
                  pull_request_numbers = $pullRequestNumbers
              }

              statistics = @{

                  commits = $commitCount

                  pull_requests = $pullRequestCount

                  files_changed = $changedFileCount
              }


              token_usage = $tokenUsage
          }


          # ========================================================
          # SERIALIZE
          # ========================================================

          Write-Host "Serializing n8n payload..."


          $json = $payload |
            ConvertTo-Json `
              -Depth 20


          # ========================================================
          # SAVE
          # ========================================================

          $json |
            Out-File `
              "$env:GITHUB_WORKSPACE\n8n_payload.json" `
              -Encoding utf8


          Write-Host "=============================================="

          Write-Host "n8n payload created."

          Write-Host "Payload size: $($json.Length) characters"

          Write-Host "=============================================="


      # ============================================================
      # 12. SEND RESULT TO N8N
      # ============================================================

      - name: Send release notes to n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_RELEASE_NOTES_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_RELEASE_NOTES_CALLBACK_SECRET }}
        shell: powershell
        run: |

          # --------------------------------------------------------
          # VALIDATE WEBHOOK
          # --------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($env:N8N_WEBHOOK_URL)) {

              throw "N8N_RELEASE_NOTES_WEBHOOK_URL secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:N8N_WEBHOOK_SECRET)) {

              throw "N8N_RELEASE_NOTES_CALLBACK_SECRET is not configured."
          }


          Write-Host "Sending release notes to n8n..."


          # --------------------------------------------------------
          # READ PAYLOAD
          # --------------------------------------------------------

          $payload = Get-Content `
            "$env:GITHUB_WORKSPACE\n8n_payload.json" `
            -Raw


          Write-Host "Payload size: $($payload.Length) characters"


          # --------------------------------------------------------
          # SEND
          # --------------------------------------------------------

          $result = Invoke-RestMethod `
            -Uri $env:N8N_WEBHOOK_URL `
            -Method Post `
            -Headers @{ "X-Webhook-Secret" = $env:N8N_WEBHOOK_SECRET } `
            -ContentType "application/json" `
            -Body $payload `
            -TimeoutSec 60


          Write-Host "Successfully sent release notes to n8n."


      # ============================================================
      # 13. UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload release analysis
        uses: actions/upload-artifact@v4
        with:

          name: release-notes-${{ github.run_number }}

          path: |

            release_notes.json

            release_context.txt

            commits.txt

            changed_files.txt

            file_statistics.txt

            pull_requests.json

            work_items.json

            commit_stats.json

            token_usage.json

            n8n_payload.json

          retention-days: 90
